data:
  name: slam_posed_images
  data_dir: MAP1
  scene: slam_scene
  image_dir: images/rgb
  depth_dir: images/depth
  depth_format: png
  pairs_train: pairs_train.txt
  pairs_val: pairs_val.txt
  train_size: 1000000
  val_size: 1000000
  batch_size: 32
  num_workers: 22
  preprocessing:
    resize: 512
    side: long
  load_features:
    do: True
    path: MAP1/exports/sp_features_slam.h5
    padding_length: dynamic
    padding_fn: pad_local_features

model:
  name: two_view_pipeline
  extractor:
    name: null
  allow_no_extract: True
  ground_truth:
    name: matchers.depth_matcher
    th_positive: 3
    th_negative: 5
    th_epi: 5
  matcher:
    name: matchers.lightglue
    input_dim: 256
    filter_threshold: 0.2
    flash: false
    checkpointed: true
    weights: superpoint
    loss:
      nll_balancing: 0.7
      depth_aware:
        do: True
        min_depth: 1.0
        max_depth: 300.0

train:
  seed: 42
  epochs: 50
  optimizer: adam
  lr: 1e-4
  log_every_iter: 10
  eval_every_iter: 100
  save_every_iter: 1000
  lr_schedule:
    type: exp
    start: 20
    on_epoch: true
    exp_div_10: 10
  plot:
    - 5
    - gluefactory.visualization.visualize_batch.make_match_figures

benchmarks:
  slam:
    data:
      load_features:
        do: True
        path: MAP1/exports/sp_features_slam.h5
        padding_length: dynamic
        padding_fn: pad_local_features