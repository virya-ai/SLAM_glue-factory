# Fast A/B harness for MAP1, mirroring superpoint_slam_Ouster64_B1_mini.yaml:
# 100-pair subset, 50 epochs, so a detector-health check runs in ~2 minutes.
# Trains the descriptor only (train.opt_regexp: descriptor below) and keeps the
# pretrained detector frozen; freeze_batch_normalization then keeps that
# detector bit-exact. Expect ~100-320 keypoints/frame at the inference
# threshold of 0.005 -- a collapsed detector gives ~3. With the detector
# frozen, loss/detector sits near 0.7 and barely moves; a value in the
# thousands means the input images are not scaled to [0,1].
data:
  name: slam_posed_images
  data_dir: MAP1_mini
  scene: slam_scene
  image_dir: images/rgb
  depth_dir: images/depth
  depth_format: png
  train_size: 1000000
  val_size: 1000000
  batch_size: 32
  num_workers: 22
  preprocessing:
    resize: null
    side: long
  load_features:
    do: True
    path: MAP1_mini/exports/pseudo_labels_slam.h5
    padding_length: dynamic
    padding_fn: pad_local_features

model:
  name: two_view_pipeline
  extractor:
    name: extractors.superpoint_open
    max_num_keypoints: 512
    force_num_keypoints: False
    detection_threshold: 0.2
    nms_radius: 4
    trainable: True
    lambda_d: 1.0
    dense_outputs: True
    depth_supervision:
      do: False
      min_depth: 1.0
      max_depth: 300.0
      method: inverse_depth
      alpha: 0.03
      eps: 1.0
      valid_weight: 1.0
      invalid_weight: 0.0
      weight_descriptor: True
      lambda_depth: 0.1
      pos_balance: 0.7
  ground_truth:
    name: null
  matcher:
    name: null
  # Use the pretrained (HPatches) BatchNorm running statistics instead of
  # letting them drift toward the fine-tuning domain. glue_main implements
  # this in BaseModel.train() (base_model.py:92) via self.apply(freeze_bn),
  # but leaves the flag default False, so nothing turns it on. Without it,
  # requires_grad=False does NOT stop running_mean/running_var updates:
  # model.train() keeps overwriting the frozen detector BN buffers on every
  # forward pass, which rescales the backbone features (observed std 0.72 ->
  # 1.3-1.5) and destroys the pretrained detector even when its weights and
  # the descriptor are the only things being optimized.
  freeze_batch_normalization: True

train:
  seed: 42
  epochs: 50
  lr: 1e-4
  log_every_iter: 10
  eval_every_iter: 100
  lr_schedule:
    type: exp
    start: 20
    on_epoch: true
    exp_div_10: 10
  plot: [5, 'gluefactory.visualization.visualize_batch.make_keypoint_figures']
  opt_regexp: descriptor