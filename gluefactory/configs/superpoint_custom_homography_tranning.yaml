data:
    name: homographies
    data_dir: output/dataset
    image_dir: images
    image_list: custom_image_list.txt
    train_size: 300
    val_size: 44
    batch_size: 4
    num_workers: 16
    homography:
        difficulty: 0.7
        max_angle: 45
        patch_shape: [512, 208]
    photometric:
        name: lg
    load_features:
        do: True
        path: "output/dataset/exports/pseudo_labels.h5"
        collate: True
        max_num_keypoints: 512
        force_num_keypoints: True
model:
    name: two_view_pipeline
    extractor:
        name: extractors.superpoint_open
        max_num_keypoints: 512
        force_num_keypoints: True
        detection_threshold: -1
        nms_radius: 4
        trainable: True
        lambda_d: 1.0
        dense_outputs: True
    ground_truth:
        name: null
    matcher:
        name: null
train:
    seed: 0
    epochs: 200
    log_every_iter: 1
    eval_every_iter: 10
    lr: 1e-4
    lr_schedule:
        start: 20
        type: exp
        on_epoch: true
        exp_div_10: 10
    plot: [1, 'gluefactory.visualization.visualize_batch.make_keypoint_figures']
