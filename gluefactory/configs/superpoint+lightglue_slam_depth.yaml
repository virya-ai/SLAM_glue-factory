# End-to-end depth-aware training of SuperPoint + LightGlue on SLAM data.
# Synchronized Ouster depth is used ONLY during training to re-weight the
# detector and matching losses; inference stays RGB-only.
data:
  name: slam_posed_images
  data_dir: MAP2
  scene: slam_scene
  image_dir: images/rgb
  depth_dir: images/depth
  depth_format: png
  pairs_train: pairs_train.txt
  pairs_val: pairs_val.txt
  train_size: 1000000
  val_size: 1000000
  batch_size: 2
  num_workers: 8
  preprocessing:
    resize: 512
    side: long
  load_features:
    do: True
    path: MAP2/exports/pseudo_labels_slam.h5
    padding_length: 512
    padding_fn: pad_local_features

model:
  name: two_view_pipeline
  extractor:
    name: extractors.superpoint_open
    max_num_keypoints: 512
    force_num_keypoints: True
    detection_threshold: -1
    nms_radius: 4
    trainable: True
    lambda_d: 1.0
    dense_outputs: True
    depth_supervision:
      do: True
      min_depth: 2.0
      max_depth: 70.0
      method: inverse_depth
      alpha: 0.03
      eps: 1.0
      valid_weight: 1.0
      invalid_weight: 0.0
      weight_descriptor: True
      lambda_depth: 0.1
  ground_truth:
    name: matchers.depth_matcher
    th_positive: 3
    th_negative: 5
    th_epi: 5
  matcher:
    name: matchers.lightglue
    input_dim: 256
    filter_threshold: 0.1
    flash: false
    checkpointed: true
    weights: superpoint
    loss:
      nll_balancing: 0.5
      depth_aware:
        do: True
        min_depth: 2.0
        max_depth: 70.0
        method: inverse_depth
        alpha: 0.03
        eps: 1.0
        valid_weight: 1.0
        invalid_weight: 0.0
        pair_combine: min

train:
  seed: 42
  epochs: 200
  optimizer: adam
  lr: 1e-4
  lr_scaling: [[0.1, ["extractor."]]]
  log_every_iter: 10
  eval_every_iter: 100
  save_every_iter: 1000
  lr_schedule:
    type: exp
    start: 20
    on_epoch: true
    exp_div_10: 10
  plot:
    - 5
    - gluefactory.visualization.visualize_batch.make_match_figures

benchmarks:
  slam:
    data:
      load_features:
        do: True
        path: MAP2/exports/pseudo_labels_slam.h5
        padding_length: 512
        padding_fn: pad_local_features