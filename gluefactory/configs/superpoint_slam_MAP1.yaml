data:
  name: slam_posed_images
  data_dir: MAP1
  scene: slam_scene
  image_dir: images/rgb
  depth_dir: images/depth
  depth_format: png
  train_size: 1000000
  val_size: 1000000
  batch_size: 32
  num_workers: 22
  preprocessing:
    resize: null
    side: long
  load_features:
    do: True
    path: MAP1/exports/pseudo_labels_slam.h5
    padding_length: dynamic
    padding_fn: pad_local_features

model:
  name: two_view_pipeline
  extractor:
    name: extractors.superpoint_open
    max_num_keypoints: 512
    force_num_keypoints: False
    detection_threshold: 0.2
    nms_radius: 4
    trainable: True
    lambda_d: 1.0
    dense_outputs: True
    depth_supervision:
      do: False
      min_depth: 1.0
      max_depth: 300.0
      method: inverse_depth
      alpha: 0.03
      eps: 1.0
      valid_weight: 1.0
      invalid_weight: 0.0
      weight_descriptor: True
      lambda_depth: 0.1
      pos_balance: 0.7
  ground_truth:
    name: null
  matcher:
    name: null
  # Use the pretrained (HPatches) BatchNorm running statistics instead of
  # letting them drift toward the fine-tuning domain. glue_main implements
  # this in BaseModel.train() (base_model.py:92) via self.apply(freeze_bn),
  # but leaves the flag default False, so nothing turns it on. Without it,
  # requires_grad=False does NOT stop running_mean/running_var updates:
  # model.train() keeps overwriting the frozen detector BN buffers on every
  # forward pass, which rescales the backbone features (observed std 0.72 ->
  # 1.3-1.5) and destroys the pretrained detector even when its weights and
  # the descriptor are the only things being optimized.
  freeze_batch_normalization: True

train:
  seed: 42
  epochs: 100
  lr: 1e-4
  log_every_iter: 10
  eval_every_iter: 100
  lr_schedule:
    type: exp
    start: 40
    on_epoch: true
    exp_div_10: 20
  plot: [5, 'gluefactory.visualization.visualize_batch.make_keypoint_figures']
  # Only the descriptor head is optimized; the backbone and detector head keep
  # their official SuperPoint weights, which model.freeze_batch_normalization
  # then keeps bit-exact. Trainable-everything does NOT work here: the detector
  # is fed features the descriptor head is reshaping, and inference collapses.
  #
  # Read loss/detector on these frozen-detector runs with care. The detector is
  # not in the optimizer, so it is a near-constant disagreement score (roughly
  # 0.7 here) rather than a health metric. Judge the run by inference keypoint
  # count against stock SuperPoint, not by this number. A loss/detector in the
  # thousands means the input images are not scaled to [0,1] -- see
  # gluefactory/datasets/slam_posed_images.py.
  opt_regexp: descriptor